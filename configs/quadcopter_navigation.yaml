# ─────────────────────────────────────────────────────────────
#  Quadcopter Aerial Gym navigation domain
#  RTX Ada4000 12GB VRAM  →  Qwen2.5-Coder-7B-Instruct Q4_K_M
# ─────────────────────────────────────────────────────────────

model:
  temperature: 0.9                             # Stays low for stricter, deterministic code generation
  top_p: 0.95
  max_tokens: 2048
  n_ctx: 8192
  n_gpu_layers: -1                             # fits Qwen2.5-7B Q4_K_M in 12GB

pipeline:
  num_candidates: 5
  task_name: quadcopter_aerial_gym_navigation  # Updated to reflect Aerial Gym framework
  save_all_raw: false
  random_seed: 42

runtime_test:
  batch_size: 16
  max_episode_len: 500

domain:
  name: "quadcopter_navigation"                # must match prompts/quadcopter_navigation.py
  task_description: |
    We are training a quadrotor to navigate to a target position in an Aerial Gym RL environment. 
    The reward function must process `pos_error`, penalize abrupt changes between `action` and `prev_action`, 
    and update the `crashes` state if the drone flies out of bounds (distance > 8.0). 
    It must return a tuple of (total_reward, crashes).
  env_reference_path: "envs/quadcopter_in_aerial_gym_sim.py"
  step_dt: 0.02
  cfg_scales:
    pos_reward_scale:            2.0           # Maps to parameter_dict inside the prompt
    dist_reward_scale:           1.0
    action_penalty_scale:       -0.05
  tensor_shapes:
    "pos_error":      [16, 3]                  # Batch size 16, 3D vector
    "crashes":        [16]                     # 1D batch tensor for crash states
    "action":         [16, 4]                  # 4 rotor commands
    "prev_action":    [16, 4]                  # 4 rotor commands from previous step