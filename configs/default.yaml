model:
  temperature: 0.7
  top_p: 0.95
  max_tokens: 1024
  n_ctx: 4096
  n_gpu_layers: 35

pipeline:
  num_candidates: 2
  task_name: uav_navigation
  save_all_raw: false
  random_seed: 42

runtime_test:
  batch_size: 16
  max_episode_len: 500

# ── NEW: domain adapter ───────────────────────────────────
domain:
  name: "uav_navigation"
  task_description: |
    UAV quadcopter navigation task using IsaacLab DirectRLEnv.
    The robot must fly to a 3D target position while minimising
    oscillations and maintaining stable flight.
    Available state: root_lin_vel_b, root_ang_vel_b,
                     root_pos_w, projected_gravity_b, desired_pos_w
  env_reference_path: "envs/quadcopter_env_reference.py"
  step_dt: 0.02
  cfg_scales:
    lin_vel_reward_scale: -0.05
    ang_vel_reward_scale: -0.01
    distance_to_goal_reward_scale: 15.0
  tensor_shapes:
    "robot.data.root_lin_vel_b":      [16, 3]
    "robot.data.root_ang_vel_b":      [16, 3]
    "robot.data.root_pos_w":          [16, 3]
    "robot.data.projected_gravity_b": [16, 3]
    "desired_pos_w":                  [16, 3]